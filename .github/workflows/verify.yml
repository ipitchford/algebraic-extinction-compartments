name: Exact finite replay
on: [push, pull_request, workflow_dispatch]
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normal and optimized replay with negative controls
        run: python -B test_verifier.py --output-dir "${RUNNER_TEMP}/extinction-replay"
